services:
  node1:
    build: ./node
    restart: unless-stopped
    networks:
      - isotope-net
    ports:
      - "9001:9000"
      - "8081:8081"
    volumes:
      - ./state:/root/state
    environment:
      - NODE_ID=1
      - ISOTOPE_STATE_PASSWORD=${ISOTOPE_STATE_PASSWORD:-}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

